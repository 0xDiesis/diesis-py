[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diesis"
version = "0.1.0"
description = "Python SDK for the Diesis chain — exchange, intents, bundles, and patronage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["diesis", "evm", "blockchain", "defi", "sdk", "web3"]
dependencies = [
    "web3>=7.0,<8",
    "eth-account>=0.13",
    "eth-typing>=5.0",
    "eth-abi>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
